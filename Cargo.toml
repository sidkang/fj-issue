[package]
name = "fj-issue"
version = "0.1.0"
edition = "2024"
description = "Agent-first Forgejo issue CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidkang/fj-issue"

[lib]
name = "fj_issue"
path = "src/lib.rs"

[[bin]]
name = "fji"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
forgejo-api = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
wiremock = "0.6.5"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
